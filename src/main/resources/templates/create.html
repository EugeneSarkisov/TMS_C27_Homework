<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</head>
<body>
<div class="input-group mb-3">
    <form action="create" method="post" enctype="application/x-www-form-urlencoded">
        <span class="input-group-text">@</span>
        <input name="id" type="number" class="form-control" placeholder="ID" aria-label="ID"
               aria-describedby="basic-addon1">
        <span class="input-group-text">@</span>
        <input name="name" type="text" class="form-control" placeholder="Name" aria-label="Name"
               aria-describedby="basic-addon1">
        <span class="input-group-text" id="surname">@</span>
        <input name="surname" type="text" class="form-control" placeholder="Surname" aria-label="Surname"
               aria-describedby="basic-addon2">
        <span class="input-group-text" id="groupID">@</span>
        <input name="groupID" type="number" class="form-control" placeholder="Group" aria-label="GroupID"
               aria-describedby="basic-addon3">
        <span class="input-group-text" id="grade">@</span>
        <input name="grade" type="number" min="0.1" max="10.0" step="0.1" class="form-control" placeholder="Grade" aria-label="Grade"
               aria-describedby="basic-addon4">
        <button class="btn btn-primary" type="submit">Create Student</button>
    </form>
</div>
</body>
</html>
