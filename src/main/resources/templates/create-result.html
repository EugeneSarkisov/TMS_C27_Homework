<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
<ul class="list-group" th:object="${student}" id="student">
    <li class="list-group-item"><span th:text="*{id}"></span></li>
    <li class="list-group-item"><span th:text="*{name}"></span></li>
    <li class="list-group-item"><span th:text="*{surname}"></span></li>
    <li class="list-group-item"><span th:text="*{groupID}"></span></li>
    <li class="list-group-item"><span th:text="*{grade}"></span></li>
</ul>
</body>
</html>
